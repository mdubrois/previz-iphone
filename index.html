<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Previ iPhone AR</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }

    .ar-button {
      display: inline-block;
      padding: 14px 28px;
      background-color: #0071e3;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      margin-top: 20px;
    }

    .ar-button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <h1>View in Augmented Reality</h1>
  <p>Open this page on your iPhone or iPad to view the 3D model in AR.</p>

  <!--
    The key parts for iOS AR Quick Look:
    1. The <a> tag must have "rel=ar"
    2. href points to the .usdz file
    3. An <img> must be the FIRST child of the <a> tag (required by Safari)
  -->
    <img src="./st_stableDirty-structure-content-standalone-main-v005.png">
    <a href="./st_stableDirty-structure-content-standalone-main-v005.usdz" rel="ar" class="ar-button">
    View in AR 🪄
  </a>

</body>
</html>
