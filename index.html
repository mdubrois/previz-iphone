<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Previ iPhone AR</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }

    .ar-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      margin-top: 20px;
    }

    .ar-link img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: block;
    }

    .ar-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 12px 24px;
      background-color: #0071e3;
      color: white;
      border-radius: 12px;
      font-size: 18px;
      font-family: sans-serif;
    }

    .ar-link:hover .ar-badge {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <h1>View in Augmented Reality</h1>
  <p>Open this page on your iPhone or iPad to view the 3D model in AR.</p>

  <!--
    iOS AR Quick Look requirements:
    1. The <a> tag must have rel="ar"
    2. href points to the .usdz file
    3. An <img> must be the FIRST child of the <a> tag (required by Safari)
       — this img also acts as the thumbnail
  -->
  <a href="toy_car.usdz" rel="ar" class="ar-link">
    <img src="st_stableDirty-structure-content-standalone-main-v005.png" alt="3D Model Preview" />
    <span class="ar-badge">View in AR 🪄</span>
  </a>

</body>
</html>
